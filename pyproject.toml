[project]
name = "google-contacts-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Google Contacts"
authors = [{ name = "Justin Dray", email = "justin@dray.be" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"

dependencies = [
    "mcp>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.0.0",
]

[project.scripts]
google-contacts-mcp = "google_contacts_mcp.server:main"

[dependency-groups]
dev = [
    "coverage>=7.2.5",
    "mock>=5.0.2",
    "pytest-cov>=6.0",
    "pytest>=8.0",
    "ruff>=0.12.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_contacts_mcp"]
