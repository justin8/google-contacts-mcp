name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  build-and-test:
    uses: justin8/workflows/.github/workflows/python-build-test.yml@main

  publish:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Check version change
        id: check_version
        run: |
          pip install tomli
          current_version=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Current version: $current_version"
          git checkout HEAD^
          prev_version=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          git checkout -
          echo "Previous version: $prev_version"

          if [ "$current_version" != "$prev_version" ]; then
            echo "Version changed from $prev_version to $current_version"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$current_version" >> $GITHUB_OUTPUT
            git tag "$current_version" || :
            git push --tags || :
          else
            echo "Version unchanged. Skipping publish."
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Download built package
        if: steps.check_version.outputs.version_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Publish package to PyPI
        if: steps.check_version.outputs.version_changed == 'true'
        run: uv publish
